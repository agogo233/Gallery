name: Cloud CI (armv8)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - "graphics/**"
      - "LICENSE"
      - "CODEOWNERS"
  workflow_dispatch:

jobs:
  build-armv8:
    name: Build armv8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check & decode signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_KEY_BASE64:-}" ]; then
            echo "::error::Signing secrets are not configured. Set SIGNING_KEY_BASE64, KEY_STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to produce a signed APK."
            exit 1
          fi
          echo "${SIGNING_KEY_BASE64}" | base64 -d > keystore.jks
          {
            echo "storeFile=../keystore.jks"
            echo "storePassword=${KEY_STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Build armv8 APK
        run: ./gradlew assembleFossRelease -Parmv8Only

      - name: Package flat zip
        run: |
          cd app/build/outputs/apk/foss/release
          zip -j gallery-armv8.zip *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-armv8
          path: app/build/outputs/apk/foss/release/gallery-armv8.zip
          if-no-files-found: error